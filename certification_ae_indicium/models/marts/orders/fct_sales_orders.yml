version: 2

models:
  - name: fct_sales_orders
    description:  Fact table for sales orders, containing measures such as order quantity, unit price, and unit discount, along with foreign keys to the dimension tables

    columns:
      - name: fact_surrogate_key
        description: Surrogate key for the fact table, generated by hashing the natural keys of the order
        data_tests:
          - unique
          - not_null

      - name: product_id
        description: Product id for each order in the fact table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: surrogate_key

      - name: order_id
        description: Order id for each order in the fact table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_order_detail')
                field: surrogate_key

      - name: customer_id
        description: Customer id for each order in the fact table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: surrogate_key

      - name: address_id
        description: Address id for each order in the fact table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: surrogate_key

      - name: date_id
        description: Date id for each order in the fact table
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: surrogate_key

      - name: order_qty
        description: Order quantity for each product in the order
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: unit_price
        description: Unit price for each product in the order
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: unit_discount
        description: Unit discount for each product in the order
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: ">= 0"